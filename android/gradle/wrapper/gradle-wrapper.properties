# Gradle wrapper. The packaged jar is not committed (it is a 43 KB binary that
# this environment cannot download); CI installs Gradle 8.9 with
# gradle/actions/setup-gradle and runs `gradle` directly, and a local build does
# the same. Keeping the version here documents the exact toolchain either way.
distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
distributionUrl=https\://services.gradle.org/distributions/gradle-8.9-bin.zip
networkTimeout=10000
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
